<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Toque nos dois bichinhos fofinhos e descubra a surpresa!"><title>Junta Bichinhos</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:20px;background:#fff2e1 radial-gradient(#e9b99f 1px,transparent 1px) 0 0/24px 24px;color:#442442;font-family:system-ui,sans-serif;text-align:center}main{background:#fffcf6;border:2px solid #492747;border-radius:32px;box-shadow:0 8px #492747;width:min(100%,520px);padding:clamp(18px,5vw,42px)}h1,h2{font-family:Georgia,serif;line-height:1;margin:.35em 0;font-size:clamp(2.2rem,9vw,4rem)}small{letter-spacing:.16em;font-weight:800}p{line-height:1.45}.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:20px 0}.pet{min-width:0;border:2px solid #492747;border-radius:24px;padding:16px 4px;background:#fbe0e8;box-shadow:0 5px #492747;color:inherit}.pet:last-child{background:#dcefd0}.face{display:block;font-size:clamp(2.8rem,12vw,5rem)}button{cursor:pointer;font:inherit;font-weight:750}button:focus-visible{outline:3px solid #8d287f;outline-offset:4px}button:disabled{cursor:default}.pet.picked{transform:translateY(4px);box-shadow:0 1px #492747}.pair.join .pet:first-child{animation:left .58s ease both}.pair.join .pet:last-child{animation:right .58s ease both}@keyframes left{50%,100%{transform:translateX(27%) rotate(8deg)}}@keyframes right{50%,100%{transform:translateX(-27%) rotate(-8deg)}}@media(prefers-reduced-motion:reduce){.pair.join .pet{animation:none!important}}.action{border:2px solid #492747;border-radius:100px;padding:12px 18px;margin:4px;background:#492747;color:white}.action+button{background:#fffcf6;color:#492747}.dots{letter-spacing:.35em;color:#8d287f;font-size:1.25rem}.sum{min-height:1.5em;font-weight:750}.party{font-size:3rem}[hidden]{display:none!important}
</style>
<main><small>✦ UMA BRINCADEIRA FOFINHA ✦</small><h1>Junta Bichinhos</h1><section id="game"><p>Toque uma vez em cada bichinho pra juntar a dupla!</p><div class="pair" id="pair"><button class="pet" type="button"><span class="face" aria-hidden="true">🐰</span><span>Coelhinho</span></button><b aria-hidden="true">+</b><button class="pet" type="button"><span class="face" aria-hidden="true">🐱</span><span>Gatinho</span></button></div></section><div id="sum" class="sum" role="status"></div><div id="dots" class="dots" aria-hidden="true"></div><p id="count" aria-live="polite"></p><section id="end" hidden><div class="party" aria-hidden="true">🐰 🎉 🐱</div><h2 id="reveal" tabindex="-1">Você foi bobo de ter feito isso!</h2><p>Mande para um amigo ser bobo também 😜</p><button class="action" id="share" type="button">Mandar para um amigo</button><button class="action" id="reset" type="button">Reiniciar</button><p id="feedback" role="status"></p></section></main>
<script>
const $=id=>document.getElementById(id), pets=[...document.querySelectorAll('.pet')];
let total=0, picks=new Set();
function count(){ $('count').textContent=`${total} de 5 rodadas`; $('dots').textContent='●'.repeat(total)+'○'.repeat(5-total); }
function clearPicks(){picks.clear();$('pair').classList.remove('join');pets.forEach(p=>{p.disabled=false;p.classList.remove('picked');});}
function pick(i){if(total===5 || picks.has(i) || picks.size===2)return; picks.add(i); pets[i].disabled=true;pets[i].classList.add('picked');if(picks.size===1){$('sum').textContent='1 + …';if(document.activeElement===document.body)pets[1-i].focus();return;} $('sum').textContent='1 + 1 = 2';$('pair').classList.add('join');setTimeout(()=>{total++;count();if(total===5){$('game').hidden=true;$('end').hidden=false;$('reveal').focus();}else{clearPicks();$('sum').textContent='Dupla juntada! Bora de novo?';if(document.activeElement===document.body)pets[0].focus();}},700);}
pets.forEach((p,i)=>p.addEventListener('click',()=>pick(i)));
$('reset').onclick=()=>{total=0;clearPicks();count();$('sum').textContent='';$('feedback').textContent='';$('end').hidden=true;$('game').hidden=false;pets[0].focus();};
$('share').onclick=async()=>{const url=location.href.split(/[?#]/)[0];if(navigator.share){try{await navigator.share({title:'Junta Bichinhos',text:'Consegue chegar a 5? 🐰🐱',url});return;}catch(e){if(e.name==='AbortError')return;}}try{await navigator.clipboard.writeText(url);$('feedback').textContent='Link copiado!';}catch{$('feedback').textContent='Copie este link: '+url;}};
count();
</script></html>
